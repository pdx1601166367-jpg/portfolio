<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquid Effect · 预览</title>
<link rel="icon" href="assets/favicon.png" />
<style>
  html, body { margin: 0; height: 100%; background: #f4f6f5; overflow: hidden; }
  #liquid-canvas { display: block; width: 100vw; height: 100vh; }
  .hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: 400 12px/1.4 -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: #1a1a1a; opacity: .35; letter-spacing: .04em; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="liquid-canvas"></canvas>
<div class="hint">移动 / 触摸屏幕，文字会像液态金属一样涟漪 · 修改文件顶部 config 自定义文案与配色</div>

<script type="module">
  // ===== 可配置内容（对应 React 组件的 props）=====
  const config = {
    text: ["YANG JIE", "Portfolio"],   // 主标题，每行一个字符串
    subText: "AI Product Manager",     // 标题上方小标签
    tagline: "Design  •  Build  •  Think", // 标题下方说明
    backgroundColor: "#f4f6f5",
    textColor: "#1a1a1a"
  };

  // 把文字渲染到离屏 canvas，再交给 threejs-components 做液体扭曲
  function generateTextImage() {
    const dpr = window.devicePixelRatio || 1;
    const offscreen = document.createElement("canvas");
    const w = window.innerWidth, h = window.innerHeight;
    offscreen.width = w * dpr; offscreen.height = h * dpr;
    const ctx = offscreen.getContext("2d");
    if (!ctx) return null;
    ctx.scale(dpr, dpr);

    // 背景
    ctx.fillStyle = config.backgroundColor;
    ctx.fillRect(0, 0, w, h);

    const hasContent = config.text.length || config.subText || config.tagline;
    if (hasContent) {
      // 柔和氛围光，给液体表面反射
      ctx.globalCompositeOperation = "multiply";
      const g1 = ctx.createRadialGradient(w * 0.5, h * 0.1, 0, w * 0.5, h * 0.1, w * 0.6);
      g1.addColorStop(0, "rgba(220,225,240,0.6)");
      g1.addColorStop(1, "rgba(250,250,250,1)");
      ctx.fillStyle = g1; ctx.fillRect(0, 0, w, h);
      const g2 = ctx.createRadialGradient(w * 0.5, h * 0.95, 0, w * 0.5, h * 0.95, w * 0.5);
      g2.addColorStop(0, "rgba(240,230,220,0.4)");
      g2.addColorStop(1, "rgba(250,250,250,1)");
      ctx.fillStyle = g2; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = "source-over";

      // 小标签
      if (config.subText) {
        ctx.fillStyle = config.textColor; ctx.globalAlpha = 0.35;
        const f = Math.max(11, w * 0.009);
        ctx.font = `600 ${f}px -apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif`;
        ctx.textAlign = "center"; ctx.letterSpacing = "0.25em";
        ctx.fillText(config.subText.toUpperCase(), w / 2, h / 2 - w * 0.095);
      }

      // 主标题
      const fontSize = Math.min(w * 0.13, h * 0.19);
      ctx.globalAlpha = 1; ctx.letterSpacing = "-0.04em";
      ctx.font = `700 ${fontSize}px -apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const lineHeight = fontSize * 1.08;
      const totalHeight = (config.text.length || 0) * lineHeight;
      const startY = h / 2 - totalHeight / 2 + lineHeight / 2;
      config.text.forEach((line, i) => {
        ctx.fillStyle = config.textColor; ctx.globalAlpha = 1;
        ctx.fillText(line, w / 2, startY + i * lineHeight);
      });

      const dividerY = startY + (config.text.length || 0) * lineHeight + w * 0.018;
      if (config.text.length && config.tagline) {
        ctx.globalAlpha = 0.12; ctx.fillStyle = config.textColor;
        ctx.fillRect(w / 2 - 30, dividerY, 60, 0.5);
      }
      if (config.tagline) {
        ctx.globalAlpha = 0.3; ctx.letterSpacing = "0.02em";
        const tf = Math.max(11, w * 0.01);
        ctx.font = `400 ${tf}px -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif`;
        ctx.fillText(config.tagline, w / 2, dividerY + w * 0.025);
      }
    }
    return offscreen.toDataURL("image/png");
  }

  const dataUrl = generateTextImage();

  // 运行时从 jsdelivr 加载 threejs-components（Kevin Levron 的库，MIT）
  import("https://cdn.jsdelivr.net/npm/threejs-components@0.0.30/build/backgrounds/liquid1.min.js")
    .then((mod) => {
      const LiquidBackground = mod.default;
      const canvas = document.getElementById("liquid-canvas");
      const app = LiquidBackground(canvas);
      app.loadImage(dataUrl);
      app.liquidPlane.material.metalness = 0.35;   // 0-1，越高越反光
      app.liquidPlane.material.roughness = 0.45;   // 0-1，越低反射越锐
      app.liquidPlane.uniforms.displacementScale.value = 2; // 涟漪强度
      app.setRain(false);                          // true = 自动雨滴涟漪
      window.__liquidApp = app;
    })
    .catch((e) => {
      console.error("Liquid effect failed to load (needs network for CDN):", e);
    });
</script>
</body>
</html>
